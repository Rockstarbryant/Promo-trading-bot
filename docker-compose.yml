services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: promo_user
      POSTGRES_PASSWORD: promo_pass
      POSTGRES_DB: promo_trader
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promo_user -d promo_trader"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://promo_user:promo_pass@postgres:5432/promo_trader
      DATABASE_URL_SYNC: postgresql+psycopg2://promo_user:promo_pass@postgres:5432/promo_trader
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      BACKEND_API_BASE_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
